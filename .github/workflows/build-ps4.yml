name: Build RPCS3 PS4 PKG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dependencies (OpenOrbis, llvm-mingw, Ninja, Mesa, Porting-kit)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\ps4tools"

          # 1. OpenOrbis PS4 Toolchain v0.5.4 (busca automatica do ficheiro Windows/Toolchain)
          $ooRel = Invoke-RestMethod "https://github.com"
          $ooAsset = $ooRel.assets | Where-Object { $_.name -match "win.*\.zip$|toolchain.*\.tar\.gz$" } | Select-Object -First 1
          Write-Host "A baixar OpenOrbis: $($ooAsset.browser_download_url)"
          curl.exe -fL "$($ooAsset.browser_download_url)" -o "C:\ps4tools\$($ooAsset.name)"
          New-Item -ItemType Directory -Force -Path "C:\ps4tools\OpenOrbis"
          if ($ooAsset.name -like "*.zip") {
            Expand-Archive "C:\ps4tools\$($ooAsset.name)" -DestinationPath "C:\ps4tools\OpenOrbis" -Force
          } else {
            tar -xzf "C:\ps4tools\$($ooAsset.name)" -C "C:\ps4tools\OpenOrbis"
          }

          # 2. llvm-mingw 20240619 ucrt x86_64
          curl.exe -fL "https://github.com" -o "C:\ps4tools\llvm.zip"
          Expand-Archive "C:\ps4tools\llvm.zip" -DestinationPath "C:\ps4tools" -Force

          # 3. Ninja
          New-Item -ItemType Directory -Force -Path "rpcs3-ps4\ps4-port\.build-tools"
          curl.exe -fL "https://github.com" -o "C:\ps4tools\ninja.zip"
          Expand-Archive "C:\ps4tools\ninja.zip" -DestinationPath "rpcs3-ps4\ps4-port\.build-tools" -Force

          # 4. orbis-porting-kit e orbis-mesa-bundle
          git clone https://github.com orbis-porting-kit
          cd orbis-porting-kit; git checkout 213b0c38ff25ea7ca402c8844a6494086d0f1cae; cd ..

          New-Item -ItemType Directory -Force -Path "orbis-mesa-bundle"
          $mesaRel = Invoke-RestMethod "https://github.com"
          $mesaAsset = $mesaRel.assets | Where-Object { $_.name -match "\.tar\.gz$|\.zip$" } | Select-Object -First 1
          Write-Host "A baixar Mesa: $($mesaAsset.browser_download_url)"
          curl.exe -fL "$($mesaAsset.browser_download_url)" -o "C:\ps4tools\$($mesaAsset.name)"
          if ($mesaAsset.name -like "*.zip") {
            Expand-Archive "C:\ps4tools\$($mesaAsset.name)" -DestinationPath "orbis-mesa-bundle" -Force
          } else {
            tar -xzf "C:\ps4tools\$($mesaAsset.name)" -C "orbis-mesa-bundle"
          }

      - name: Prepare and Build RPCS3 PS4
        shell: pwsh
        working-directory: rpcs3-ps4
        run: |
          $Sdk = (Get-ChildItem "C:\ps4tools\OpenOrbis" -Recurse -Filter "PS4Toolchain" -Directory | Select-Object -First 1).FullName
          if (-not $Sdk) { $Sdk = "C:\ps4tools\OpenOrbis" }
          Write-Host "SDK detetado em: $Sdk"
          $Llvm = "C:\ps4tools\llvm-mingw-20240619-ucrt-x86_64\bin"
          $Version = [regex]::Match((Get-Content rpcs3/util/ps4_build_version.hpp -Raw), 'ps4_build_version\[\]\s*=\s*"([0-9]+\.[0-9]{2})"').Groups.Value

          git config user.email "builder@local"
          git config user.name "Builder"
          git update-index --add --cacheinfo "160000,ca7933e47d3a3451d81e72ac174dcb5aa28b59d1,3rdparty/llvm/llvm"
          git commit -m "Record RPCS3's LLVM submodule pin" --allow-empty

          ./ps4-port/prepare-abseil.ps1
          ./ps4-port/prepare-make.ps1
          ./ps4-port/build-llvm.ps1 -Sdk $Sdk -CompilerBin $Llvm -Jobs 4

          cmake -S . -B ps4-port/.build-abi -G Ninja `
            "-DCMAKE_MAKE_PROGRAM=$PWD/ps4-port/.build-tools/ninja.exe" `
            -DRPCS3_PS4_PORT=ON `
            -DCMAKE_TOOLCHAIN_FILE=ps4-port/toolchain.cmake `
            "-DRPCS3_PS4_SDK=$Sdk" "-DRPCS3_PS4_LLVM_BIN=$Llvm" `
            -DRPCS3_PS4_WITH_LLVM=ON

          cmake --build ps4-port/.build-abi --target rpcs3_ps4_elf -j 4
          ./ps4-port/package-native.ps1 -Sdk $Sdk -LlvmTools $Llvm -Version $Version

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-PS4-Custom-PKG
          path: rpcs3-ps4/**/*.pkg
